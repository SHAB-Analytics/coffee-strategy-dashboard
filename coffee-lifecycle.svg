ont-family="Arial,sans-serif" font-size="14">Extract & serve</text><path d="M1115 220 H1155" stroke="#b97742" stroke-width="3" stroke-linecap="round"/><path d="M1147 212 L1155 220 L1147 228" fill="none" stroke="#b97742" stroke-width="3"/><circle cx="1215" cy="220" r="55" fill="#f1d2a5" opacity="0.98"/><text x="1215" y="235" text-anchor="middle" font-size="38" font-family="Arial">☕</text><text x="1215" y="305" text-anchor="middle" fill="#f4c27a" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">08 · EXPERIENCE</text><text x="1215" y="333" text-anchor="middle" fill="#efe3d6" font-family="Arial,sans-serif" font-size="14">Customer value</text><text x="700" y="392" text-anchor="middle" fill="#c9a27e" font-family="Arial,sans-serif" font-size="15">Simulation lens: sourcing • roasting • pricing • operations • expansion • profitability</text></svg>